<!DOCTYPE html>
<html>

<head>

<title>Vision Supply Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<script>
if (localStorage.getItem("ownerLoggedIn") !== "true") {
  window.location.href = "login.html";
}
</script>


<header>

<h1>VISION SUPPLY</h1>

<p>Owner Dashboard</p>

</header>



<section>


<h2>Add New Product</h2>


<div class="admin-box">


<input id="name" placeholder="Product Name">

<input id="brand" placeholder="Brand">

<input id="price" placeholder="Price">

<input id="size" placeholder="Size (Example: 100ml)">

<input id="category" placeholder="Category (Men/Women)">


<textarea id="description" placeholder="Description"></textarea>


<input id="notes" placeholder="Fragrance Notes">


<input id="image" placeholder="Image Link">


<input id="quantity" placeholder="Quantity">


<label>Status</label>
<select id="status">
<option>Available</option>
<option>Sold Out</option>
</select>



<label>New Drop?</label>
<select id="newDrop">
<option>No</option>
<option>Yes</option>
</select>



<label>Best Seller?</label>
<select id="bestSeller">
<option>No</option>
<option>Yes</option>
</select>



<button onclick="addProduct()">
Add Product
</button>


</div>


</section>




<section>


<h2>Your Inventory</h2>


<div id="products"></div>


</section>




<button onclick="logout()">
Logout
</button>




<script type="module" src="admin.js"></script>


</body>

</html>
