<!DOCTYPE html>
<html>

<head>
<title>Vision Supply Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<script>
if (localStorage.getItem("ownerLoggedIn") !== "true") {
  window.location.href = "login.html";
}
</script>


<header>
<h1>VISION SUPPLY</h1>
<p>Owner Dashboard</p>
</header>


<section>

<h2>Add Product</h2>

<input id="name" placeholder="Product Name">
<br><br>

<input id="brand" placeholder="Brand">
<br><br>

<input id="price" placeholder="Price">
<br><br>

<input id="size" placeholder="Size">
<br><br>

<input id="category" placeholder="Category">
<br><br>

<textarea id="description" placeholder="Description"></textarea>
<br><br>

<input id="notes" placeholder="Fragrance Notes">
<br><br>

<input id="image" placeholder="Image Link">
<br><br>

<input id="quantity" placeholder="Quantity">
<br><br>

<select id="status">
<option>Available</option>
<option>Sold Out</option>
</select>

<br><br>

<select id="newDrop">
<option>No</option>
<option>Yes</option>
</select>

<br><br>

<select id="bestSeller">
<option>No</option>
<option>Yes</option>
</select>

<br><br>

<button onclick="addProduct()">Add Product</button>

</section>


<section>

<h2>Your Inventory</h2>

<div id="products"></div>

</section>


<button onclick="logout()">Logout</button>


<script src="admin.js"></script>

</body>

</html>
